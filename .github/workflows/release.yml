# Releases what changed on main (release/README.md): gives each changed
# component its next version, commits that to main as "release: ...", then
# publishes the new versions to this repository's GitHub Releases with the
# catalog.json the Store reads. Run it by hand (Actions, Release), with the
# component ids to release or none for every changed one; a dry run shows the
# versions and builds them without pushing or publishing.
#
# yandex-on-cluster fork: run this from main (the job gates on main, as
# upstream). main is kept fast-forwarded to the yandex default branch.
name: Release

on:
  workflow_dispatch:
    inputs:
      components:
        description: Component ids to release, space-separated (empty releases every changed component)
        required: false
        default: ''
      dry_run:
        description: Dry run (no release commit pushed, nothing published)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commits: each runs in the job that holds the
# contents: write token.
jobs:
  publish:
    # main only: the release commit goes on top of it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SOURCE_DATE_EPOCH comes from each component's last commit, and
          # each component's last release from its <id>@<version> tag
          fetch-depth: 0
          # publishing talks to the API through GH_TOKEN; the push below
          # passes the token itself
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      # the next versions, from the labels of the merged pull requests
      - name: Stamp
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ inputs.components }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # shellcheck disable=SC2086 # one id per word
          node release/release.js stamp $COMPONENTS
          git log -1 --stat

      # fails when main moved on since the checkout: run the release again
      - name: Push the release commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main

      # the tools' builds run make target: Docker, preinstalled on the runner
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # the stamped components, and any a stopped run left unlisted
        run: node release/release.js publish --stamped $DRY_RUN

      - name: Published catalog
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
        run: node release/release.js list
